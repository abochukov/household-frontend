<div class="header-wrapper">
  <div class="toolbar-panel">
    <ul class="toolbar">
      <li style="position: relative">
        <fa-icon [icon]="faUser" #userIconRef (click)="handleUserClick()"></fa-icon>
        <span style="padding-left: 10px" (click)="handleUserClick()">{{ username }}</span>
        <div class="dropdown" *ngIf="userDropdownVisible" #userDropdownRef>
          <ul>
            <li>Всички адреси</li>
            <li>
              <a routerLink="/userProfile">Профил</a>
            </li>
            <li (click)="handleSignOut()">Излизане</li>
          </ul>
        </div>
      </li>
    </ul>
  </div>
</div>
