<div class="auth-page">
  <div class="auth-right solo-card">
    <div class="login-card">
      <div class="login-header">
        <h2>Смяна на парола</h2>
        <p>Въведете нова парола за вашия акаунт</p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="submit()">
        <div class="form-group">
          <label>Нова парола</label>
          <input
            type="password"
            formControlName="newPassword"
            placeholder="Минимум 6 символа"
          />
        </div>

        <div class="form-group">
          <label>Потвърди парола</label>
          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="Повтори новата парола"
          />
        </div>

        <small class="error-text" *ngIf="resetForm.errors?.['passwordMismatch'] && resetForm.touched">
          Паролите не съвпадат.
        </small>

        <button type="submit" class="login-button" [disabled]="resetForm.invalid || submitting">
          {{ submitting ? 'Записване...' : 'Смени паролата' }}
        </button>
      </form>

      <div class="login-footer">
        <a [routerLink]="['/login']">Обратно към вход</a>
      </div>
    </div>
  </div>
</div>
