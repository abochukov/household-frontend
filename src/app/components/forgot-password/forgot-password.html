<div class="auth-page">
  <div class="auth-right solo-card">
    <div class="login-card">
      <div class="login-header">
        <h2>Забравена парола</h2>
        <p>Въведете имейл, за да получите линк за смяна на паролата</p>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            formControlName="email"
            placeholder="example@email.com"
            [class.input-error]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
          />
        </div>

        <button type="submit" class="login-button" [disabled]="forgotPasswordForm.invalid || sending">
          {{ sending ? 'Изпращане...' : 'Изпрати линк' }}
        </button>
      </form>

      <div class="login-footer">
        <a [routerLink]="['/login']">Обратно към вход</a>
      </div>
    </div>
  </div>
</div>
