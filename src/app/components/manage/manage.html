<div class="manage-container">
  <h2>Управление на апартаменти</h2>
  
  <div class="apartament-list">
    <app-apartament-list-item 
      *ngFor="let apartament of apartaments"
      [city]="apartament.city"
      [neighbourhood]="apartament.neighbourhood"
      [address]="apartament.address"
      [property_id]="apartament.property_id"
      [property_number]="apartament.property_number"
      [floor]="apartament.floor"
      [member_amount]="apartament.member_amount"
      [elevator]="apartament.elevator">
    </app-apartament-list-item>
  </div>
  
  <div *ngIf="apartaments.length === 0" class="no-data">
    <p>Няма добавени апартаменти</p>
  </div>
</div>
