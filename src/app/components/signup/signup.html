<div class="auth-page">
  <div class="auth-left">
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-book-open"></i>
      </div>

      <h2>
        Domova<span>Kniga</span>
      </h2>
    </div>

    <div class="auth-content">
      <div class="auth-badge">
        Създай своя профил
      </div>

      <h1>
        Стартирай бързо и
        сигурно
      </h1>

      <p>
        Регистрацията е бърза. След потвърждение на имейла ще можете
        да управлявате вашите адреси, имоти и разходи от едно място.
      </p>

      <div class="auth-image">
        <img src="assets/login/dashboard-preview.png" alt="Dashboard Preview" />
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="login-card">
      <div class="mobile-logo">
        <div class="logo-icon">
          <i class="fas fa-book-open"></i>
        </div>

        <h2>
          Domova<span>Kniga</span>
        </h2>
      </div>

      <div class="login-header">
        <h2>Регистрация</h2>
        <p>Създайте нов потребителски акаунт</p>
      </div>

      <form [formGroup]="signupForm" (ngSubmit)="submit()">
        <div class="double-row">
          <div class="form-group">
            <label>Име</label>
            <input type="text" formControlName="firstname" placeholder="Иван" />
          </div>

          <div class="form-group">
            <label>Фамилия</label>
            <input type="text" formControlName="lastname" placeholder="Петров" />
          </div>
        </div>

        <div class="form-group">
          <label>Потребителско име</label>
          <input type="text" formControlName="username" placeholder="ivan.petrov" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="example@email.com" />
        </div>

        <div class="form-group">
          <label>Телефон (по избор)</label>
          <input type="text" formControlName="phone" placeholder="0888 123 456" />
        </div>

        <div class="double-row">
          <div class="form-group">
            <label>Парола</label>
            <div class="password-wrapper">
              <input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="Минимум 6 символа"
              />
              <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>Потвърди парола</label>
            <div class="password-wrapper">
              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                formControlName="confirmPassword"
                placeholder="Повторете паролата"
              />
              <button type="button" class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword">
                <i class="fas" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>
        </div>

        <small class="error-text" *ngIf="signupForm.errors?.['passwordMismatch'] && signupForm.touched">
          Паролите не съвпадат.
        </small>

        <button type="submit" class="login-button" [disabled]="signupForm.invalid">
          Създай акаунт
        </button>
      </form>

      <div class="login-footer">
        <p>Вече имате акаунт?</p>
        <a [routerLink]="['/login']">Вход</a>
      </div>
    </div>
  </div>
</div>
