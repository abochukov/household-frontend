<div class="create-property-container">
  <form [formGroup]="propertyForm" (ngSubmit)="submitHandler()">
    <div class="title">Създаване на нов имот</div>
    <div class="info">Изберете адрес и попълнете данните за имота.</div>

    <app-address-list
      [addresses]="addresses"
      [loading]="loading"
      [control]="addressControl"
      [required]="true"
      label="Изберете адрес"
      validationMessage="Моля, изберете адрес"
      emptyMessage="Няма налични адреси. Моля, създайте адрес първо."
      (addressSelected)="handleAddressSelection($event)"
    ></app-address-list>

    <div class="form-row">
      <div class="form-group">
        <label>Номер на имот <span class="required-field">*</span></label>
        <input 
          type="text" 
          formControlName="property_number" 
          [class.invalid]="propertyForm.get('property_number')?.invalid && propertyForm.get('property_number')?.touched">
        <div class="error-message" *ngIf="propertyForm.get('property_number')?.invalid && propertyForm.get('property_number')?.touched">
          Моля, въведете номер на имот
        </div>
      </div>

      <div class="form-group">
        <label>Етаж <span class="required-field">*</span></label>
        <input 
          type="number" 
          formControlName="floor"
          [class.invalid]="propertyForm.get('floor')?.invalid && propertyForm.get('floor')?.touched">
        <div class="error-message" *ngIf="propertyForm.get('floor')?.invalid && propertyForm.get('floor')?.touched">
          Моля, въведете етаж
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Брой живущи <span class="required-field">*</span></label>
        <input 
          type="number" 
          formControlName="member_amount"
          [class.invalid]="propertyForm.get('member_amount')?.invalid && propertyForm.get('member_amount')?.touched">
        <div class="error-message" *ngIf="propertyForm.get('member_amount')?.invalid && propertyForm.get('member_amount')?.touched">
          Моля, въведете брой живущи (минимум 1)
        </div>
      </div>

      <div class="form-group">
        <label>Площ (кв.м) <span class="required-field">*</span></label>
        <input
          type="number"
          formControlName="area"
          [class.invalid]="propertyForm.get('area')?.invalid && propertyForm.get('area')?.touched"
        >
        <div class="error-message" *ngIf="propertyForm.get('area')?.invalid && propertyForm.get('area')?.touched">
          Моля, въведете площ (минимум 1)
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>% идеални части</label>
        <input
          type="number"
          formControlName="ideal_share"
          min="0"
          max="100"
          step="0.01"
          [class.invalid]="propertyForm.get('ideal_share')?.invalid && propertyForm.get('ideal_share')?.touched"
        >
        <div class="error-message" *ngIf="propertyForm.get('ideal_share')?.invalid && propertyForm.get('ideal_share')?.touched">
          Моля, въведете стойност между 0 и 100
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>E-mail</label>
        <input
          type="email"
          formControlName="email"
          [class.invalid]="propertyForm.get('email')?.invalid && propertyForm.get('email')?.touched"
        >
        <div class="error-message" *ngIf="propertyForm.get('email')?.invalid && propertyForm.get('email')?.touched">
          Моля, въведете валиден e-mail
        </div>
      </div>

      <div class="form-group">
        <label>Телефон</label>
        <input type="text" formControlName="phone_number">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Домашни любимци</label>
        <select formControlName="pets">
          <option [ngValue]="false">Не</option>
          <option [ngValue]="true">Да</option>
        </select>
      </div>

      <div class="form-group">
        <label>Дава ли се под наем</label>
        <select formControlName="rent">
          <option [ngValue]="false">Не</option>
          <option [ngValue]="true">Да</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Използва ли асансьор</label>
        <select formControlName="elevator">
          <option [ngValue]="false">Не</option>
          <option [ngValue]="true">Да</option>
        </select>
      </div>
    </div>

    <button type="submit" class="custom-btn-success" [disabled]="propertyForm.invalid || !selectedAddress || loading">
      Запази
    </button>
  </form>
</div>
